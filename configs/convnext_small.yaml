name: convnext_small
backbone: convnext_small.fb_in22k_ft_in1k
seed: 42

image_size: 224
batch_size: 64
grad_accum: 1
grad_checkpointing: true
num_workers: 4
crop_scale: [0.8, 1.0]
crop_ratio: [0.75, 1.3333333333333333]

warmup_epochs: 2
max_epochs: 60
patience: 4
min_delta: 0.0

opt: adamw
head_lr: 1.0e-3
lr: 3.0e-4
layer_decay: 0.8627
expected_backbone_floor: 1.268e-06
weight_decay: 0.05
drop_path: 0.1
max_grad_norm: 1.0

pos_weight_cap: 10.0
softmax_weight: 1.0
bce_weight: 1.0

role: capacity_probe
capacity_reference_run: convnext_tiny_s42
capacity_confounds:
  - unlike convnext_base this keeps the classifier head at 768 dims and 82,283 parameters, identical to the reference, so width does not move alongside capacity and the warmup phase is the same one the reference ran; isolating capacity is the entire point of this run
  - layer_decay 0.8627 rather than the project's standing 0.75, matched on the derived backbone floor per FINDINGS 7A.4
  - one seed, so seed variance is unmeasured and could exceed the primary band in FINDINGS 7B

monitor: constrained
monitor_mode: max
selection_primary: map_bce
selection_guard: map_softmax
selection_epsilon: 0.01
stopping_mode: convergence
log_every: 50
